# Render deployment for the backend API.
#
# The frontend deploys separately to Netlify (see netlify.toml). This file
# describes only the Express service.

services:
  - type: web
    name: celestial-chatbot-api
    runtime: node
    rootDir: backend
    plan: free

    # Must match the region the Neon project was created in. A single request
    # makes several round trips to Postgres -- the vector search, the archive
    # write, and the migration at boot -- so putting the API on another
    # continent from the database is felt on every call. Render defaults to
    # Oregon when this is omitted; the database is in ap-southeast-1.
    region: singapore

    buildCommand: npm ci
    # Migrations run before the server starts, so a deploy that adds a table
    # cannot serve traffic against the old schema. Every statement is
    # idempotent, so repeated deploys are safe.
    startCommand: npm run db:migrate && npm start

    # Render already polls "/" for health; keeping it explicit documents that
    # the route exists and must stay unauthenticated.
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "20"

      # Render terminates TLS at its proxy and passes the client address in
      # X-Forwarded-For. Without this every request looks like it came from the
      # proxy and the IP rate limits would apply to all users collectively.
      - key: TRUST_PROXY
        value: "1"

      # Set these in the Render dashboard, not here. Anything written in this
      # file is committed to the repository.
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: raises the NASA rate limit from 10/hour to 1,000/hour.
      - key: NASA_API_KEY
        sync: false
