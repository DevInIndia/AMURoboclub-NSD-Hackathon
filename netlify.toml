# Netlify build for the frontend.
#
# The base directory is `frontend`, so Netlify installs and builds there rather
# than at the repo root (where package.json only orchestrates the dev servers).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path must serve index.html so React Router can handle
# it. Without this, a refresh on /stargazing returns a 404 from the CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The API is a separate origin, so these apply only to the static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    X-Frame-Options = "DENY"

# Hashed asset filenames change on every build, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
